[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[temperature_sensor h]
sensor_type: temperature_host
sensor_path: /nonexistent
min_temp: 0
max_temp: 100

[gcode_macro SHOW]
gcode:
  {action_respond_info("h=%s" % (printer["temperature_host h"],))}
