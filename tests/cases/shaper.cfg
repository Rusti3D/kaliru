[stepper_x]
step_pin: PA1
dir_pin: PA2
enable_pin: !PA3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA4
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PB1
dir_pin: PB2
enable_pin: !PB3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PC1
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC4
position_endstop: 0
position_max: 200

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000

[adxl345]
cs_pin: PA15

[resonance_tester]
accel_chip: adxl345
probe_points: 100, 100, 20

[input_shaper]

[shaper_calibrate]
