[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[temperature_sensor b]
sensor_type: BME280
i2c_bus: i2c1a
bme280_oversample_temp: 0
bme280_iir_filter: 3


[temperature_sensor h]
sensor_type: temperature_host
sensor_path: /nonexistent
min_temp: 0
max_temp: 100


[gcode_macro SHOW]
gcode:
  {action_respond_info("h=%s" % (printer["temperature_host h"],))}
  {action_respond_info("b=%s" % (printer["bme280 b"],))}
  {action_respond_info("t=%s" % (printer["temperature_sensor b"],))}
