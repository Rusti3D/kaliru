# ACEPRO's virtual_pins (tests/plugins/virtual_pins.py) behind kaliru's
# native pin users: its digital_out (the issue #1 config), pwm, adc and
# endstop pins
[mcu]
serial: /dev/null

[printer]
kinematics: none
max_velocity: 100
max_accel: 100

[virtual_pins]

[output_pin ace_pro]
pin: virtual_pin:ace_pro
pwm: False
value: 1
shutdown_value: 0

[output_pin vpwm]
pin: virtual_pin:vpwm
pwm: True
value: 0.5
cycle_time: 0.01

[temperature_sensor vtemp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: virtual_pin:vtemp
min_temp: -273
max_temp: 1000

[manual_stepper vstep]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: virtual_pin:vstop

# batch runs keep no gcode responses: the pins' state goes to the log as
# the case's closing error
[gcode_macro SHOW_PINS]
gcode:
  {action_raise_error(printer['virtual_pins'].pins|string)}
