[mcu]
serial: /dev/rpmsg_pru30

[mcu host]
serial: /tmp/klipper_host_mcu

[replicape]
revision: B3
host_mcu: host
enable_pin: !gpio20
stepper_x_microstep_mode: spread16
stepper_x_current: 0.5
stepper_y_microstep_mode: 16
stepper_y_current: 0.8
stepper_y_chopper_off_time_high: True
stepper_z_microstep_mode: stealth16
stepper_z_current: 0.5
stepper_z_chopper_blank_time_high: False
stepper_e_microstep_mode: 4
stepper_e_current: 1.5
stepper_e_chopper_hysteresis_high: True
standstill_power_down: True

[stepper_x]
step_pin: gpio27
dir_pin: gpio29
enable_pin: replicape:stepper_x_enable
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio81
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: gpio12
dir_pin: gpio22
enable_pin: replicape:stepper_y_enable
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio17
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: gpio23
dir_pin: gpio26
enable_pin: replicape:stepper_z_enable
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio31
position_endstop: 0
position_max: 200

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30

[extruder]
step_pin: gpio28
dir_pin: gpio15
enable_pin: replicape:stepper_e_enable
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: replicape:power_e
sensor_type: EPCOS 100K B57560G104F
sensor_pin: host:analog4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: replicape:power_hotbed
sensor_type: EPCOS 100K B57560G104F
sensor_pin: host:analog6
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: replicape:power_fan0
hardware_pwm: True

[output_pin myout]
pin: !replicape:power_fan1
pwm: True
value: 0.25
shutdown_value: 0.5

[output_pin dig]
pin: replicape:power_fan2
value: 1

[servo myservo]
pin: replicape:servo0
