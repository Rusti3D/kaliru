# gcode_shell_command whose program does not exist: Popen's
# FileNotFoundError is logged, then raised as the gcode error's __context__
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[gcode_shell_command NOPE]
command: kaliru-no-such-program --flag
timeout: 1

[delayed_gcode run_nope]
initial_duration: 0.1
gcode:
  RUN_SHELL_COMMAND CMD=NOPE
