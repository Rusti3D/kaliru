[stepper_x]
step_pin: PA1
dir_pin: PA2
enable_pin: !PA3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA4
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PB1
dir_pin: PB2
enable_pin: !PB3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PC1
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 200

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000

[load_cell_probe]
sensor_type: hx711
sclk_pin: PE2
dout_pin: PE3
z_offset: 0.1
counts_per_gram: 450.5
reference_tare_counts: 1200
trigger_force: 50
pullback_speed: 0.1
notch_filter_frequencies: 5, 6, 7
