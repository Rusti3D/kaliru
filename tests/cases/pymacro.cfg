# python g-code macros: helpers, status access, variables, errors
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[gcode_macro PY_STATUS]
gcode:
  !pos = printer.toolhead["position"]
  !respond_info("%r %s %.3f" % (pos, pos.x, math.sqrt(2)))
  !respond_info("%r %r" % (printer.get("nope", 5), "toolhead" in printer))
  !respond_info(repr(printer["gcode_macro PY_VARS"]))
  !respond_info(repr(printer.toolhead["homed_axes"]))
  !respond_info(",".join(n for n in printer if n.startswith("gcode_macro")))

[gcode_macro PY_VARS]
variable_count: 0
variable_lst: [1, 2]
variable_d: {"a": 1.5, "b": None}
gcode:
  !own_vars.count = own_vars.count + 1
  !respond_info("count %d %r %r %r" % (own_vars.count, "count" in own_vars, "x" in own_vars, own_vars.d))

[gcode_macro PY_MUTATE]
gcode:
  !l = printer["gcode_macro PY_VARS"]["lst"]
  !l.append(3)
  !respond_info(repr(printer["gcode_macro PY_VARS"]["lst"]))

[gcode_macro PY_ITER]
variable_ab: 1
gcode:
  !for name in own_vars:
  !    respond_info(name)

[gcode_macro PY_OWN_KEYERR]
variable_a: 1
gcode:
  !own_vars.nope

[gcode_macro PY_KEYERR]
gcode:
  !printer["nope"]

[gcode_macro PY_GET_NODEFAULT]
gcode:
  !printer.get("nope")

[gcode_macro PY_NAMEERR]
gcode:
  !respond_info(undefined_name)

[gcode_macro PY_ZERO]
gcode:
  !x = 1 / 0

[gcode_macro PY_EMITERR]
gcode:
  !emit("G1 X9999")

[gcode_macro PY_CATCH]
gcode:
  !try:
  !    emit("NOT_A_COMMAND")
  !except Exception as e:
  !    respond_info("%s.%s: %s" % (type(e).__module__, type(e).__name__, e))

[gcode_macro PY_RAISE]
gcode:
  !raise_error("boom")

[gcode_macro PY_RAISE2]
gcode:
  !action_raise_error("boom2")

[gcode_macro PY_RAISE_EMPTY]
gcode:
  !raise RuntimeError()

[gcode_macro PY_PARAMS]
gcode:
  !respond_info("%s|%s|%r" % (params.get("A", "none"), rawparams, sorted(params)))

[gcode_macro PY_SETVAR]
gcode:
  !set_gcode_variable("PY_VARS", "count", 10)
  !emit("PY_VARS")

[gcode_macro PY_SETVAR_BAD]
gcode:
  !set_gcode_variable("NOPE", "count", 10)

[gcode_macro PY_MOVE]
gcode:
  !emit("G28")
  !emit("G1 X10 Y10 F6000")
  !wait_moves()
  !sleep(0.2)
  !respond_info("moved %r" % (printer.toolhead.position,))
  !wait_until(lambda: True)
  !wait_while(lambda t: False)
  !respond_info("blocking %r" % (blocking(lambda: 41 + 1),))

[gcode_macro PY_LOG]
gcode:
  !action_log("hello log")
  !action_respond_info("hello respond")
  !respond_info(123)

[gcode_macro PY_ARGS]
gcode:
  !respond_info()

[gcode_macro PY_JINJA_CALL]
gcode:
  !emit("PY_JINJA X=1")

[gcode_macro PY_JINJA]
gcode:
  { action_respond_info("jinja " + params.X) }

[gcode_macro PY_DEF]
gcode:
  !def f(x):
  !    return x * 2
  !respond_info(str(f(21)))

[gcode_macro PY_OWNMUT]
variable_lst: [1]
gcode:
  !own_vars.lst.append(len(own_vars.lst))
  !respond_info(repr(own_vars.lst))
