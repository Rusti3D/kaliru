# danger_options override_pressure_advance_smooth_time_max (Kalico
# test/test_extruder_overrides_simple.py, test_configs/extruder_overrides)
[danger_options]
override_pressure_advance_smooth_time_max: 1.0

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210
pressure_advance: 0.025
pressure_advance_smooth_time: 0.8
