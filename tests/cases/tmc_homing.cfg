# Sensorless homing details (Kalico test/test_tmc_homing.py): a nonzero
# TCOOLTHRS kept across homing, the home current (capped at the driver's
# maximum), homing moves that do not use a driver's virtual endstop
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PC0
dir_pin: PL0
enable_pin: !PA7
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 250
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PA5
diag_pin: PH6
run_current: .5
home_current: .3
sense_resistor: 0.110
driver_SGTHRS: 80
coolstep_threshold: 50

[stepper_y]
step_pin: PC1
dir_pin: !PL1
microsteps: 16
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_endstop: 0
position_max: 210
homing_retract_dist: 0

[tmc5160 stepper_y]
cs_pin: PG2
run_current: .7
home_current: .5
current_change_dwell_time: 0.5
sense_resistor: 0.075
diag1_pin: !PK7

[stepper_z]
step_pin: PC2
dir_pin: PL2
microsteps: 16
rotation_distance: 8
endstop_pin: ^PB4
position_endstop: 0.5
position_max: 200

[tmc2208 stepper_z]
uart_pin: PK5
run_current: .5
sense_resistor: 0.220
