# PID_PROFILE with dual loop pid, mpc and watermark heaters (Kalico
# test/test_pid_profile.py)
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[fan]
pin: PD6

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: mpc
heater_power: 50
cooling_fan: fan
filament_density: 1.20
filament_heat_capacity: 1.8
block_heat_capacity: 22.3110
sensor_responsiveness: 0.0998635
ambient_transfer: 0.155082
fan_ambient_transfer: 0.155082, 0.20156, 0.216441
min_temp: 0
max_temp: 210

[temperature_sensor bed_heater]
sensor_type: Generic 3950
sensor_pin: PF4
min_temp: 0
max_temp: 120

[heater_bed]
heater_pin: PB5
sensor_type: Generic 3950
sensor_pin: PK6
max_power: 1.0
min_temp: 0
max_temp: 120
control: dual_loop_pid
inner_sensor_name: bed_heater
inner_max_temp: 135.0
pid_kp: 42.894
pid_ki: 0.376
pid_kd: 1224.094
inner_pid_kp: 60.499
inner_pid_ki: 2.425
inner_pid_kd: 377.360

[heater_generic chamber]
heater_pin: PH5
sensor_type: Generic 3950
sensor_pin: PK7
control: watermark
max_delta: 2.0
min_temp: 0
max_temp: 80
