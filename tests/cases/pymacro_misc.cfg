[mcu]
serial: /dev/null

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[delayed_gcode PYDELAY]
initial_duration: 0.1
gcode:
  !respond_info("delayed")

[gcode_macro JLIST]
variable_lst: [1]
gcode:
  {action_respond_info("jinja sees %s" % (lst,))}

[gcode_macro PLIST]
gcode:
  !printer["gcode_macro JLIST"]["lst"].append(5)
  !emit("JLIST")
