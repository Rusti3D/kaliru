[stepper_x]
step_pin: PA1
dir_pin: PA2
enable_pin: !PA3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA4
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PB1
dir_pin: PB2
enable_pin: !PB3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PC1
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 200

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000

[probe_eddy_current my]
sensor_type: ldc1612
z_offset: 1.0
i2c_bus: i2c1a
x_offset: 5
y_offset: -3
amplitude_errors: low
reg_drive_current: 20
intb_pin: PD5
calibrate:
    0.050000:3304105.000,0.090000:3290001.000,0.130000:3277000.123,
    0.170000:3265002.500,0.210000:3254100.000

[probe_eddy_current other]
sensor_type: ldc1612
z_offset: 0.5
i2c_bus: i2c1
frequency: 40000000
register_as_probe: False

[bed_mesh]
mesh_min: 10,10
mesh_max: 150,150
probe_count: 3,3
