[stepper_x]
step_pin: PA1
dir_pin: PA2
enable_pin: !PA3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA4
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PB1
dir_pin: PB2
enable_pin: !PB3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PC1
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC4
position_endstop: 0
position_min: -5
position_max: 200

[mcu]
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000

[tools_calibrate]
pin: ^PD1
spread: 4
initial_spread_y: 6
lift_z: 1.5
lower_z: -1
samples: 2
samples_result: median
samples_tolerance: 100

[gcode_macro TOOLVARS]
variable_offset: None
gcode:
  {action_respond_info("offset=%s" % (printer["gcode_macro TOOLVARS"].offset,))}

[gcode_macro SHOW]
gcode:
  {action_respond_info("loc=%s last=%s inactive=%s" % (printer.tools_calibrate.sensor_location, printer.tools_calibrate.last_result, printer.tools_calibrate.calibration_probe_inactive))}
