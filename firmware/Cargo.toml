[package]
name = "kaliru-mcu"
version = "0.1.0"
edition = "2021"
description = "Kalico's micro-controller firmware ported to Rust"
license = "GPL-3.0-only"
build = "build/main.rs"

[[bin]]
name = "kaliru-mcu"
path = "src/main.rs"

# the Linux process MCU (src/linux of Kalico) uses libc
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }

[profile.release]
opt-level = 2
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
