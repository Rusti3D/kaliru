[package]
name = "kaliru"
version = "0.1.0"
edition = "2021"
description = "Kalico (Klipper fork) ported to Rust"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kaliru"
path = "src/main.rs"

[[bin]]
name = "parsedump"
path = "src/bin/parsedump.rs"

[[bin]]
name = "configdump"
path = "src/bin/configdump.rs"

[[bin]]
name = "pinsdump"
path = "src/bin/pinsdump.rs"

[[bin]]
name = "qltest"
path = "src/bin/qltest.rs"

[[bin]]
name = "reactortest"
path = "src/bin/reactortest.rs"

[[bin]]
name = "sqtest"
path = "src/bin/sqtest.rs"

[[bin]]
name = "tracedump"
path = "src/bin/tracedump.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
rustc-hash = "1.1"
flate2 = "1"
libc = "0.2"
corosensei = "0.3"
minijinja = { version = "2", features = ["custom_syntax", "loop_controls"] }

[features]
default = ["plugins"]
# python plugins (klippy/extras, klippy/plugins modules) and python g-code
# macros on the host's CPython 3.15+, loaded only when a config uses one
# (docs/PLUGINS.md)
plugins = []

[lints.clippy]
# Kept as in Kalico, on purpose (parity before style):
# constants copied digit for digit from the python / C source
excessive_precision = "allow"
# !(a < b) is python's comparison: true for a NaN, unlike a >= b
neg_cmp_op_on_partial_ord = "allow"
# f64::clamp panics on NaN / inverted bounds where python's min(max()) doesn't
manual_clamp = "allow"
# numeric ports index several arrays in step, as the source does
needless_range_loop = "allow"
# register values spelled as in the source (FLAG & 0x00, x * 1)
identity_op = "allow"
erasing_op = "allow"
# constructors build the python object graph (Rc<Self>, KResult<...>)
new_ret_no_self = "allow"
wrong_self_convention = "allow"
# tables shaped like the python dicts and tuples they port
type_complexity = "allow"

[profile.release]
# small binaries for printer hosts with little storage: opt-level s is 5.5 MB
# smaller than 3 (24.3 vs 29.7 MB) for the same cpu time over the stock suite
# (5.08 vs 5.04 s); z saves 1.3 MB more for 20% more cpu
opt-level = "s"
strip = true
lto = true
codegen-units = 1

[patch.crates-io]
corosensei = { path = "vendor/corosensei" }
